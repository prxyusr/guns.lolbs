  <script>
    /**
     * 1. AMBIENT PARTICLE / SNOWFALL CANVAS
     * Renders glowing violet and white drifting particles with subtle mouse parallax.
     */
    (function initParticles() {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let width, height, particles = [];
      let mouse = { x: -9999, y: -9999 };

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      window.addEventListener('resize', resize);
      resize();

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      const particleCount = Math.min(75, Math.floor((width * height) / 16000));

      for (let i = 0; i < particleCount; i++) {
        const isViolet = Math.random() > 0.45;
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 2 + 0.6,
          vx: (Math.random() - 0.5) * 0.35,
          vy: Math.random() * 0.55 + 0.15,
          alpha: Math.random() * 0.55 + 0.2,
          color: isViolet ? '168, 85, 247' : '255, 255, 255'
        });
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        for (let p of particles) {
          p.x += p.vx;
          p.y += p.vy;

          // Wrap around screen edges
          if (p.y > height) { p.y = -5; p.x = Math.random() * width; }
          if (p.x > width) p.x = 0;
          if (p.x < 0) p.x = width;

          // Subtle repulsion near cursor
          const dx = p.x - mouse.x;
          const dy = p.y - mouse.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 100) {
            p.x += (dx / dist) * 0.8;
            p.y += (dy / dist) * 0.8;
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
          ctx.shadowBlur = p.color.startsWith('168') ? 8 : 0;
          ctx.shadowColor = '#a855f7';
          ctx.fill();
        }

        requestAnimationFrame(animate);
      }

      animate();
    })();

    /**
     * 2. BROWSER ADDRESS BAR URL-SPAMMER & TAB TITLE ANIMATOR
     * Rapidly cycles hash-based routes (#/...) in the browser URL input bar via history.replaceState
     * (safe for GitHub Pages page refreshes—never 404s) and updates the terminal bar + tab title.
     */
    (function initUrlAndTitleSpammer() {
      const spamLinks = [
        "#/proxyuser",
        "#/prxyusr",
        "#/github.com/prxyusr",
        "#/instagram.com/ngltrey",
        "#/discord/d3adawak3",
        "#/open.spotify.com/prxyusr",
        "#/dev/luau",
        "#/sec/0x00",
        "#/guns.lol/proxyuser",
        "#/root@prxyusr:~#"
      ];

      const terminalTarget = document.getElementById('typewriter-text');
      let linkIdx = 0;

      // Rapidly spam links in the browser address bar & terminal bar
      setInterval(() => {
        const currentSlug = spamLinks[linkIdx % spamLinks.length];
        linkIdx++;

        try {
          if (window.history && typeof window.history.replaceState === 'function') {
            window.history.replaceState(null, '', currentSlug);
          }
        } catch (err) {
          // Silently ignore in sandboxed srcdoc iframes where replaceState is restricted
        }

        if (terminalTarget) {
          terminalTarget.textContent = `https://prxyusr.github.io/${currentSlug}`;
        }
      }, 150);

      // Classic guns.lol style typing browser tab title
      const titleFrames = [
        "@",
        "@P",
        "@Pr",
        "@Pro",
        "@Prox",
        "@Proxy",
        "@ProxyU",
        "@ProxyUs",
        "@ProxyUse",
        "@ProxyUser",
        "@ProxyUser // dev",
        "@ProxyUser",
        "@ProxyUse",
        "@ProxyUs",
        "@ProxyU",
        "@Proxy",
        "@Prox",
        "@Pro",
        "@Pr",
        "@P"
      ];
      let titleIdx = 0;
      setInterval(() => {
        document.title = titleFrames[titleIdx % titleFrames.length];
        titleIdx++;
      }, 260);
    })();

    /**
     * 3. SUBTLE 3D TILT HOVER EFFECT ON GLASS CARD
     * Responds smoothly to pointer movement on desktop while staying stable on touch devices.
     */
    (function initCardTilt() {
      const card = document.getElementById('tilt-card');
      const wrapper = card.parentElement;

      wrapper.addEventListener('mousemove', (e) => {
        if (window.innerWidth < 640) return; // Disable tilt on small touch screens
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -6;
        const rotateY = ((x - centerX) / centerX) * 6;

        card.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
      });

      wrapper.addEventListener('mouseleave', () => {
        card.style.transform = 'rotateX(0deg) rotateY(0deg)';
      });
    })();

    /**
     * 4. AMBIENT SYNTH AUDIO ENGINE & CLICK-TO-ENTER UNLOCK
     * Uses Tone.js to generate a lush dark ambient synth chord loop with zero external audio files.
     * (You can also swap this out for an <audio src="song.mp3"> tag if you upload an MP3 to GitHub!)
     */
    let audioInitialized = false;
    let isPlaying = false;
    let synthLoop = null;
    let masterVol = null;

    async function startAmbientAudio() {
      try {
        await Tone.start();

        if (!audioInitialized) {
          masterVol = new Tone.Volume(-10).toDestination();

          const reverb = new Tone.Reverb({
            decay: 6,
            wet: 0.65
          }).connect(masterVol);

          const filter = new Tone.Filter(900, "lowpass").connect(reverb);

          const polySynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: {
              attack: 1.5,
              decay: 1.2,
              sustain: 0.6,
              release: 3.0
            }
          }).connect(filter);

          // Lush dark minor-9th chord progression
          const chords = [
            ["C3", "G3", "Bb3", "D4", "Eb4"],
            ["Ab2", "Eb3", "G3", "C4", "D4"],
            ["F2", "C3", "Eb3", "G3", "Ab3"],
            ["G2", "D3", "F3", "Bb3", "D4"]
          ];

          let step = 0;
          synthLoop = new Tone.Loop((time) => {
            polySynth.triggerAttackRelease(chords[step % chords.length], "2m", time);
            step++;
          }, "2m").start(0);

          Tone.Transport.bpm.value = 72;
          audioInitialized = true;
        }

        Tone.Transport.start();
        isPlaying = true;
        updateAudioUI();
      } catch (err) {
        console.warn("Audio initialization prevented:", err);
      }
    }

    function toggleAudio() {
      if (!audioInitialized) {
        startAmbientAudio();
        return;
      }

      if (isPlaying) {
        Tone.Transport.pause();
        isPlaying = false;
      } else {
        Tone.Transport.start();
        isPlaying = true;
      }
      updateAudioUI();
    }

    function updateAudioUI() {
      const icon = document.getElementById('play-pause-icon');
      icon.className = isPlaying ? 'fa-solid fa-pause text-xs' : 'fa-solid fa-play text-xs';
    }

    // Click-to-enter overlay dismiss
    const overlay = document.getElementById('enter-overlay');
    overlay.addEventListener('click', () => {
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 700);
      startAmbientAudio();
    });

    // Play/Pause button
    document.getElementById('play-pause-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleAudio();
    });

    // Volume slider
    const volumeSlider = document.getElementById('volume-slider');
    const volumeIcon = document.getElementById('volume-icon');

    volumeSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      if (masterVol) {
        // Map 0-100 to decibels (-45dB to 0dB)
        masterVol.volume.value = val === 0 ? -Infinity : (val / 100) * 35 - 35;
      }

      if (val === 0) {
        volumeIcon.className = 'fa-solid fa-volume-xmark text-zinc-500 text-xs w-4';
      } else if (val < 50) {
        volumeIcon.className = 'fa-solid fa-volume-low text-zinc-400 text-xs w-4';
      } else {
        volumeIcon.className = 'fa-solid fa-volume-high text-zinc-400 text-xs w-4';
      }
    });

    /**
     * 5. CLIPBOARD & TOAST HELPER
     * Uses document.execCommand('copy') for reliable clipboard copying inside iframes & browsers.
     */
    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast-box');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.textContent = msg;

      toast.classList.remove('opacity-0', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-3');
      }, 2400);
    }

    function copyDiscordTag(tag) {
      const tempInput = document.createElement('input');
      tempInput.value = tag;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        showToast(`Copied ${tag} to clipboard!`);
      } catch (err) {
        showToast(`Discord: ${tag}`);
      }
      document.body.removeChild(tempInput);
    }

    /**
     * 6. REAL PERSISTENT VIEW COUNTER (CounterAPI with resilient localStorage fallback)
     * Increments globally on real GitHub Pages visits and falls back cleanly if offline/sandboxed.
     */
    (async function initViewCounter() {
      const counterEl = document.getElementById('view-counter');
      const localKey = 'proxyuser_bio_views_v1';
      let localCount = parseInt(localStorage.getItem(localKey) || '0', 10);
      if (isNaN(localCount) || localCount < 0) localCount = 0;

      // Increment local count immediately so offline/sandboxed views still count
      localCount += 1;
      localStorage.setItem(localKey, localCount.toString());

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);

        const res = await fetch('https://api.counterapi.dev/v1/proxyuser-prxyusr-bio/visits/up', {
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          const remoteCount = Number(data && data.count);
          if (!isNaN(remoteCount) && remoteCount > 0) {
            const finalCount = Math.max(remoteCount, localCount);
            localStorage.setItem(localKey, finalCount.toString());
            counterEl.textContent = finalCount.toLocaleString();
            return;
          }
        }
      } catch (err) {
        // Fallback silently to local persistent count when offline or blocked
      }

      counterEl.textContent = localCount.toLocaleString();
    })();
  </script>
